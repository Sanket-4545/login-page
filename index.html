<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login 💖</title>

<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-box {
    background: #fff;
    width: 90%;
    max-width: 350px;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    animation: fadeIn 1s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  h2 {
    color: #ff4f81;
    margin-bottom: 10px;
  }

  p {
    color: #777;
    font-size: 14px;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 15px;
  }

  input:focus {
    outline: none;
    border-color: #ff4f81;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 14px;
    background: #ff4f81;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #e84372;
    transform: scale(1.05);
  }

  .note {
    margin-top: 15px;
    font-size: 12px;
    color: #aaa;
  }
</style>
</head>

<body>

<div class="login-box">
  <h2>🌸 Welcome 🌸</h2>
  <p>Login to start your test</p>

  <form onsubmit="login(event)">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login ✨</button>
  </form>

  <div class="note">For students only 💖</div>
</div>

<script>
  function login(event) {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "Sanket" && password === "28062006") {
      // SAME TAB OPEN
      window.location.href =
        "https://docs.google.com/forms/d/e/1FAIpQLScNk9i7V_WKL_Dpao0ieKHLuonlvyuZ7Z_q2Q2plgzomVnhBA/viewform";
    } else {
      alert("❌ Wrong username or password");
    }
  }
</script>

</body>
</html>
